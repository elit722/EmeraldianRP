plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Wathe (jar fourni) + Cardinal Components (embarqués dans Wathe, nécessaires pour compiler contre GameWorldComponent)
    modImplementation files("libs/wathe-1.4.2-1.21.1.jar")
    modImplementation files(
        "libs/cardinal-components-base-6.1.1.jar",
        "libs/cardinal-components-entity-6.1.1.jar",
        "libs/cardinal-components-scoreboard-6.1.1.jar",
        "libs/cardinal-components-world-6.1.1.jar"
    )
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
